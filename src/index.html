<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>demo-app</title>
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="demo-app">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <span class="app-title">demo-app</span>
        <span id="app-environment-badge" hidden></span>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-menu-checklist" class="icon-btn" aria-label="체크리스트">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
        <button type="button" id="btn-menu-theme" class="icon-btn" aria-label="테마">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button type="button" id="btn-menu-info" class="icon-btn" aria-label="앱 정보">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <section id="section-checklist" class="section">
        <h2>체크리스트</h2>
        <form id="checklist-form">
          <input type="text" id="checklist-input" placeholder="새 항목을 입력하세요" maxlength="200">
          <button type="submit" class="btn btn-primary">추가</button>
        </form>
        <ul id="checklist-items" class="checklist-items"></ul>
        <p id="checklist-empty" class="empty-state">항목이 없습니다.</p>
      </section>

      <section id="section-theme" class="section">
        <h2>테마</h2>
        <div class="theme-options">
          <button type="button" class="theme-option" data-theme="system">시스템</button>
          <button type="button" class="theme-option" data-theme="light">밝게</button>
          <button type="button" class="theme-option" data-theme="dark">어둡게</button>
        </div>
      </section>

      <section id="section-info" class="section">
        <h2>앱 정보</h2>
        <div id="app-info-content" class="app-info-content"></div>
      </section>
    </main>

    <footer class="app-footer">
      <span id="footer-version">demo-app v{{APP_VERSION}}{{ENV_SUFFIX}}</span>
      <span id="footer-date">업데이트: {{BUILD_DATE}}</span>
    </footer>

    <!-- 설치 버튼: 설정 맨 아래에 항상 표시 -->
    <div class="install-section">
      <button type="button" id="btn-install-app" class="install-btn" aria-describedby="app-install-status">앱 설치</button>
      <p id="app-install-status" class="install-status"></p>
    </div>
  </div>

  <!-- 앱 정보 모달 -->
  <div id="info-modal" class="modal hidden">
    <div class="modal-content">
      <button type="button" id="btn-close-modal" class="modal-close" aria-label="닫기">×</button>
      <h3>앱 정보</h3>
      <div id="app-info-modal-content"></div>
      <button type="button" id="btn-copy-diagnostics" class="btn btn-secondary">진단 정보 복사</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
